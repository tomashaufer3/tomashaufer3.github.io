  <title>Czech Academy of Sciences</title>
  <!-- The Academy roundel and English wordmark, rebuilt as vector geometry from
       assets/img/AVcoat/CAS_basic_logo_ENG_black.ai rather than traced.

       The knockout is done by paint order, not by a fill rule: the disc is laid
       down first and the "A" is a separate white path on top of it. Recolouring
       every fill to navy therefore erased the A entirely. The 23 ink paths are
       navy; the one white path stays the paper colour so the monogram reads.
       That does mean the roundel is opaque to the page behind it — which is
       fine in the footer, where it sits on flat paper-alt.

       CERGE-EI is a joint workplace of Charles University and the Economics
       Institute of the Czech Academy of Sciences, which is why all three marks
       belong in the footer together. -->
