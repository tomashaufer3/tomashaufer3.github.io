<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pilcrow">
  <title>Tomáš Haufer</title>
  <!-- The header mark: a pilcrow in a hairline square.

       The initials went to the favicon, where a monogram belongs. Here the
       mark sits next to the name spelled out in full, so repeating the same
       two letters beside it added nothing. The pilcrow does: it is the scribe's
       mark for "a new argument starts here", it predates printing, and it says
       something about the work rather than about the person — which is the
       only thing a mark next to a name has any business doing.

       Real EB Garamond outline (U+00B6) at wght 500, extracted from
       /assets/fonts/ebgaramond-var-normal-latin.woff2 and scaled to 34 units
       tall, centred on the 64 box. Not <text>: an <img> renders in an isolated
       context with no access to the site's webfont, and every platform draws a
       different pilcrow. See "Fonts" in README.md to regenerate.

       Referenced with <img> rather than inlined because the header is repeated
       in five HTML files. That costs the hover recolour — the name beside it
       turns red instead, which is the affordance that matters. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" fill="none"
        stroke="#B4BCC2" stroke-width="1.5"/>
