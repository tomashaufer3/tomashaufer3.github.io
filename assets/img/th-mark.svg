<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 945" role="img" aria-label="Pilcrow">
  <title>Tomáš Haufer</title>
  <!-- The header mark: a pilcrow, in CU red.

       The initials went to the favicon, where a monogram belongs. Here the
       mark sits next to the name spelled out in full, so repeating the same
       two letters beside it added nothing. The pilcrow does: it is the scribe's
       mark for "a new argument starts here", it predates printing, and it says
       something about the work rather than about the person — which is the
       only thing a mark next to a name has any business doing.

       No frame. A box around it made it a logo; without one it is simply a
       piece of type sitting in the margin, which is what a pilcrow has always
       been and how it should read.

       The viewBox is the glyph's own bounding box rather than a square, so the
       mark carries no invisible padding and can be set flush against the name.
       That also means its size is controlled entirely in CSS: height on
       .brand-mark, width auto, and the 544:945 ratio does the rest.

       Real EB Garamond outline (U+00B6) at wght 500, extracted from
       /assets/fonts/ebgaramond-var-normal-latin.woff2. Not <text>: an <img>
       renders in an isolated context with no access to the site's webfont, and
       every platform draws a different pilcrow. See "Fonts" in README.md. -->
