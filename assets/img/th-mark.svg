  <title>Tomáš Haufer</title>
  <!-- The header mark: the favicon with its colours swapped.

       Same tile, same EB Garamond TH from the same extraction, same red rule
       at the same coordinates as /assets/img/favicon.svg — only white ground
       and navy letters instead of the reverse. A reader who sees the tab icon
       and then the page header should recognise one mark, not two.

       The hairline border is not decoration. The tile is #FFFFFF and the page
       is #FAF7F0: four points of warmth apart, which is nothing. Without an
       edge the tile does not read as a tile at all, only as letters floating
       on cream, and the whole point of this variant is the card.

       Referenced with <img> rather than inlined in the markup: the outlines
       are 4 KB and the header is repeated in five HTML files. That costs the
       hover recolour — the name beside it turns red instead, which is the
       affordance that matters. -->
